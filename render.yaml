services:
  - type: web
    name: vestiq-platform
    env: node
    plan: free
    buildCommand: npm install && npx prisma db push && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: Vestiq
